<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Treniņš</title>
<style>
	:root {
		--bg: #0c0c0e;
		--card: #17171b;
		--line: rgba(255, 255, 255, 0.1);
		--text: #f2f2f4;
		--dim: #9a9aa3;
		--accent: #7cccff;
		--ok: #7aff96;
		--warn: #ffd479;
		--bad: #ff6b6b;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	}
	main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
	header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px; }
	h1 { margin: 0; font-size: 24px; }
	h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
	.level { color: var(--dim); font-size: 14px; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
	.meta { color: var(--dim); font-size: 14px; margin: 0 0 12px; }
	ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
	li { counter-increment: n; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
	li:first-child { border-top: 0; }
	li::before { content: counter(n); width: 18px; color: var(--dim); flex: none; }
	li .name { flex: 1; min-width: 0; }
	.anim { position: relative; flex: none; width: 112px; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 10px; background: #000; padding: 0; border: 0; cursor: zoom-in; }
	.anim.big { flex-basis: 100%; width: 100%; cursor: zoom-out; }
	.anim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
	.anim img + img { animation: flip 1.6s steps(1, end) infinite; }
	@keyframes flip { 0% { opacity: 0; } 50% { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .anim img + img { animation: none; opacity: 0; } }
	li .detail { color: var(--accent); white-space: nowrap; }
	a { color: var(--accent); text-decoration: none; }
	li .video { font-size: 13px; white-space: nowrap; padding: 6px 0; }
	.back { font-size: 14px; padding: 6px 0; }
	.status { margin: 12px 0 0; font-size: 14px; }
	.status.awaiting_feedback { color: var(--warn); }
	.status.done { color: var(--ok); }
	.rest { color: var(--dim); font-size: 13px; }
	.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
	.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
	button {
		font: inherit; color: var(--text); background: transparent; cursor: pointer;
		border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; min-height: 44px;
	}
	button:disabled { opacity: 0.5; cursor: default; }
	.chip[aria-pressed="true"] { background: rgba(124, 204, 255, 0.16); border-color: var(--accent); color: var(--accent); }
	.primary { background: var(--accent); border-color: var(--accent); color: #06121a; font-weight: 600; }
	.good { border-color: var(--ok); color: var(--ok); }
	.grow { flex: 1; }
	.empty { color: var(--dim); margin: 0; }
	.error { color: var(--bad); font-size: 14px; margin: 10px 0 0; min-height: 1.4em; }
</style>
</head>
<body>
<main>
	<a class="back" href="/remote.html">← Tālvadība</a>
	<header>
		<h1>Treniņš</h1>
		<span class="level" id="level"></span>
	</header>

	<section class="card" id="workout"></section>

	<section class="card">
		<h2>Ko trenēt?</h2>
		<div class="chips" id="targets"></div>
		<h2>Kas ir pieejams?</h2>
		<div class="chips" id="equipment"></div>
		<p class="meta">Ķermeņa svara vingrinājumi ir vienmēr.</p>
		<button class="primary" id="generate" style="width:100%">Ģenerēt treniņu</button>
		<p class="error" id="error" role="alert"></p>
	</section>
</main>

<script>
	const API = "/routines/api";
	const el = (tag, cls, text) => {
		const n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text !== undefined) n.textContent = text;
		return n;
	};
	const $ = (id) => document.getElementById(id);

	let state = null;
	const selected = { targets: new Set(), equipment: new Set() };
	let chipsBuilt = false;

	async function call(path, body) {
		$("error").textContent = "";
		try {
			const res = await fetch(`${API}/${path}`, {
				method: body === undefined ? "GET" : "POST",
				headers: { "Content-Type": "application/json" },
				body: body === undefined ? undefined : JSON.stringify(body)
			});
			const data = await res.json();
			if (!res.ok) throw new Error(data.error || `Kļūda ${res.status}`);
			state = data;
			render();
		} catch (e) {
			$("error").textContent = e.message;
		}
	}

	function buildChips() {
		const fill = (host, options, set) => {
			host.textContent = "";
			for (const o of options) {
				const b = el("button", "chip", o.label);
				b.type = "button";
				b.setAttribute("aria-pressed", set.has(o.id));
				b.onclick = () => {
					set.has(o.id) ? set.delete(o.id) : set.add(o.id);
					b.setAttribute("aria-pressed", set.has(o.id));
				};
				host.appendChild(b);
			}
		};
		state.prefs.targets.forEach((t) => selected.targets.add(t));
		state.prefs.equipment.forEach((e) => selected.equipment.add(e));
		fill($("targets"), state.options.targets, selected.targets);
		fill($("equipment"), state.options.equipment, selected.equipment);
		chipsBuilt = true;
	}

	const labels = (ids, options) => ids.map((id) => (options.find((o) => o.id === id) || {}).label || id);
	const FEEDBACK_TEXT = { easy: "par vieglu", ok: "tieši laikā", hard: "par grūtu" };

	function render() {
		if (!chipsBuilt) buildChips();
		$("level").textContent = `Līmenis ${state.level} / ${state.maxLevel}`;

		const host = $("workout");
		host.textContent = "";
		host.appendChild(el("h2", null, "Šodienas treniņš"));
		const w = state.workout;
		if (!w) {
			host.appendChild(el("p", "empty", "Vēl nav treniņa — izvēlies ko trenēt un nospied “Ģenerēt treniņu”."));
			return;
		}

		const eq = w.equipment.length ? labels(w.equipment, state.options.equipment).join(", ") : "bez inventāra";
		host.appendChild(el("p", "meta", `${labels(w.targets, state.options.targets).join(" · ")} — ${eq}`));

		const list = el("ol");
		for (const ex of w.exercises) {
			const li = el("li");
			if (ex.media) {
				// Divi kadri (sākuma/beigu poza) mainās animācijā; pieskāriens palielina.
				const anim = el("button", "anim");
				anim.type = "button";
				anim.setAttribute("aria-label", `Kā izpildīt: ${ex.name} (palielināt)`);
				for (const src of ex.media) {
					const img = el("img");
					img.src = `/${src}`;
					img.alt = "";
					img.loading = "lazy";
					anim.appendChild(img);
				}
				anim.onclick = () => anim.classList.toggle("big");
				li.appendChild(anim);
			}
			li.appendChild(el("span", "name", ex.name));
			if (ex.videoUrl) {
				const a = el("a", "video", ex.media ? "Vairāk video" : "▶ Video");
				a.href = ex.videoUrl;
				a.target = "_blank";
				a.rel = "noopener noreferrer";
				a.setAttribute("aria-label", `Video: kā izpildīt — ${ex.name}`);
				li.appendChild(a);
			}
			li.appendChild(el("span", "detail", ex.detail));
			list.appendChild(li);
		}
		host.appendChild(list);
		host.appendChild(el("div", "rest", `Atpūta starp sērijām: ${w.restSeconds} s`));

		const statusText = w.status === "pending" ? "Gaida izpildi"
			: w.status === "awaiting_feedback" ? "Pabeigts — kā veicās?"
			: `✓ Pabeigts${w.feedback ? ` · bija ${FEEDBACK_TEXT[w.feedback]}` : ""}`;
		host.appendChild(el("p", `status ${w.status}`, statusText));

		const actions = el("div", "actions");
		const btn = (text, cls, fn) => {
			const b = el("button", cls, text);
			b.type = "button";
			b.onclick = async () => { b.disabled = true; await fn(); };
			actions.appendChild(b);
		};
		if (w.status === "pending") btn("Pabeigts ✓", "good grow", () => call("complete", {}));
		if (w.status === "awaiting_feedback") {
			btn("Par vieglu", "grow", () => call("feedback", { feedback: "easy" }));
			btn("Tieši laikā", "grow", () => call("feedback", { feedback: "ok" }));
			btn("Par grūtu", "grow", () => call("feedback", { feedback: "hard" }));
		}
		btn("Ģenerēt citu ↻", "grow", () => call("generate", {}));
		host.appendChild(actions);
	}

	$("generate").onclick = () => call("generate", {
		targets: [...selected.targets],
		equipment: [...selected.equipment]
	});

	call("state");
	// Atsvaidzina treniņa kartīti, ja stāvoklis mainījies citur (balss komanda uz spoguļa).
	setInterval(() => { if (!document.hidden) call("state"); }, 10000);
</script>
</body>
</html>
