# comitup config — https://github.com/davesteele/comitup

# Name of the WiFi hotspot the Pi broadcasts when it has no known network.
# <nnn> is replaced by comitup with a short unique id, e.g. "MagicMirror-4f2".
ap_name: MagicMirror-<nnn>

# Password for that setup hotspot. Leave this blank here: install.sh fills it
# in /etc/comitup.conf (keeps the existing one, generates one, or uses
# `sudo ./install.sh <password>`), so no real password ends up in git.
# The mirror screen shows it while the hotspot is up (MMM-WifiSetup).
ap_password:

# Called with HOTSPOT / CONNECTING / CONNECTED on every state change.
# install.sh fills in the path of its root-owned copy of wifi-state-callback.sh
# (/usr/local/bin/mm-wifi-state-callback) — comitup runs it as the file's owner.
external_callback: __CALLBACK_PATH__
